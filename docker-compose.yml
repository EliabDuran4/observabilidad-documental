services:

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - observabilidad-net

  sqlserver_documental:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_documental
    mem_limit: 2300m
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "TuPassword123!"
    ports:
      - "1438:1433"
    volumes:
      - sqlserver_documental_data:/var/lib/mssql/data
    networks:
      - observabilidad-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - observabilidad-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observabilidad-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - observabilidad-net
    depends_on:
      - prometheus

networks:
  observabilidad-net:
    driver: bridge

volumes:
  keycloak_data:
  sqlserver_shard1_data:
  sqlserver_shard2_data:
  sqlserver_shard3_data:
  sqlserver_shard4_data:
  sqlserver_documental_data: